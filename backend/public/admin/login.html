<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Admin Login | LUXORA</title>
<link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;600;700&family=Playfair+Display:wght@500;600;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.2/css/all.min.css">
<script src="https://cdn.tailwindcss.com"></script>
<script>
    tailwind.config = {
        theme: { extend: {
            colors: { ink: '#111111', dark: '#181818', gold: { DEFAULT: '#c9a227', dark: '#a98518' }, cream: '#f8f7f4', muted: '#777777', line: '#e7e4de', soft: '#f3f2ef' },
            fontFamily: { heading: ['"Playfair Display"', 'serif'], body: ['"DM Sans"', 'sans-serif'] },
        }}
    }
</script>
</head>
<body class="font-body bg-dark min-h-screen flex items-center justify-center px-5">

    <div class="w-full max-w-[400px]">
        <div class="text-center mb-8">
            <a href="/index.html" class="font-heading text-3xl font-semibold text-white">LUXORA<span class="text-gold">.</span></a>
            <p class="mt-2 text-white/40 text-xs tracking-[2px] uppercase">Admin Panel</p>
        </div>

        <form id="loginForm" class="bg-white p-8 border border-line">
            <h1 class="font-heading text-xl font-semibold text-ink mb-6">Sign in</h1>

            <div class="flex flex-col mb-4">
                <label class="mb-2 text-[#555] text-[10px] font-bold tracking-wide uppercase">Email</label>
                <input type="email" id="email" required autocomplete="username"
                    class="h-12 px-4 border border-line outline-none text-sm focus:border-gold-dark transition" placeholder="admin@luxora.com">
            </div>

            <div class="flex flex-col mb-6">
                <label class="mb-2 text-[#555] text-[10px] font-bold tracking-wide uppercase">Password</label>
                <input type="password" id="password" required autocomplete="current-password"
                    class="h-12 px-4 border border-line outline-none text-sm focus:border-gold-dark transition" placeholder="••••••••">
            </div>

            <p id="loginError" class="hidden mb-4 text-xs text-red-600"></p>

            <button type="submit" id="loginBtn" class="w-full h-12 bg-ink text-white text-xs font-bold tracking-wide uppercase hover:bg-gold-dark transition">
                Sign In
            </button>
        </form>

        <p class="text-center text-white/30 text-xs mt-6">
            First time? Run <code class="text-white/50">npm run seed</code> to create the default admin account.
        </p>
    </div>

<script src="js/admin-common.js"></script>
<script>
    document.getElementById("loginForm").addEventListener("submit", async (e) => {
        e.preventDefault();
        const btn = document.getElementById("loginBtn");
        const errorEl = document.getElementById("loginError");
        errorEl.classList.add("hidden");
        btn.disabled = true;
        btn.textContent = "Signing in...";

        try {
            const data = await apiFetch("/auth/login", {
                method: "POST",
                body: JSON.stringify({
                    email: document.getElementById("email").value,
                    password: document.getElementById("password").value,
                }),
            });

            if (data.user.role !== "admin") {
                throw new Error("This account does not have admin access.");
            }

            Auth.setSession(data.token, data.user);
            window.location.href = "index.html";
        } catch (err) {
            errorEl.textContent = err.message;
            errorEl.classList.remove("hidden");
        } finally {
            btn.disabled = false;
            btn.textContent = "Sign In";
        }
    });

    // Already logged in? skip straight to dashboard.
    if (Auth.getToken() && Auth.getUser()?.role === "admin") {
        window.location.href = "index.html";
    }
</script>
</body>
</html>
