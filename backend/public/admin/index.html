<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Dashboard | LUXORA Admin</title>
<link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;600;700&family=Playfair+Display:wght@500;600;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.2/css/all.min.css">
<script src="https://cdn.tailwindcss.com"></script>
<script>
    tailwind.config = {
        theme: { extend: {
            colors: { ink: '#111111', dark: '#181818', gold: { DEFAULT: '#c9a227', dark: '#a98518' }, cream: '#f8f7f4', muted: '#777777', line: '#e7e4de', soft: '#f3f2ef' },
            fontFamily: { heading: ['"Playfair Display"', 'serif'], body: ['"DM Sans"', 'sans-serif'] },
        }}
    }
</script>
</head>
<body class="font-body antialiased">

<div id="adminLayout" data-active="dashboard"></div>

<script src="js/admin-common.js"></script>
<script>Auth.guard();</script>
<script src="js/admin-layout.js"></script>
<script>
    document.getElementById("adminPageTitle").textContent = "Dashboard";

    const main = document.getElementById("adminMain");
    main.innerHTML = `<p class="text-muted text-sm">Loading...</p>`;

    async function load() {
        try {
            const d = await apiFetch("/dashboard/summary");

            const statCard = (label, value, icon) => `
                <div class="bg-white border border-line p-6">
                    <div class="flex items-center justify-between mb-3">
                        <span class="text-muted text-[10px] font-bold tracking-wide uppercase">${label}</span>
                        <i class="fa-solid ${icon} text-gold-dark"></i>
                    </div>
                    <p class="font-heading text-3xl font-semibold text-ink">${value}</p>
                </div>`;

            const statusColors = {
                pending: "bg-yellow-100 text-yellow-800",
                processing: "bg-blue-100 text-blue-800",
                shipped: "bg-purple-100 text-purple-800",
                delivered: "bg-green-100 text-green-800",
                cancelled: "bg-red-100 text-red-800",
            };

            const rows = d.recentOrders
                .map(
                    (o) => `
                <tr class="border-b border-line">
                    <td class="py-3 text-sm text-ink font-medium">${o.orderNumber || ""}</td>
                    <td class="py-3 text-sm text-muted">${formatDate(o.createdAt)}</td>
                    <td class="py-3 text-sm text-ink font-semibold">${money(o.total)}</td>
                    <td class="py-3"><span class="px-2.5 py-1 rounded-full text-[10px] font-bold uppercase ${statusColors[o.status] || ""}">${o.status}</span></td>
                </tr>`
                )
                .join("");

            main.innerHTML = `
                <div class="grid grid-cols-1 sm:grid-cols-2 lg:grid-cols-4 gap-5 mb-8">
                    ${statCard("Revenue (paid)", money(d.revenue), "fa-sack-dollar")}
                    ${statCard("Total Orders", d.orderCount, "fa-bag-shopping")}
                    ${statCard("Products", d.productCount, "fa-tag")}
                    ${statCard("Customers", d.userCount, "fa-users")}
                </div>

                <div class="grid grid-cols-1 lg:grid-cols-3 gap-5 mb-8">
                    <div class="bg-white border border-line p-5 flex items-center gap-4">
                        <div class="w-10 h-10 grid place-items-center bg-yellow-50 text-yellow-700 rounded-full"><i class="fa-solid fa-clock"></i></div>
                        <div><p class="text-2xl font-semibold text-ink">${d.pendingOrders}</p><p class="text-muted text-xs">Pending orders</p></div>
                    </div>
                    <div class="bg-white border border-line p-5 flex items-center gap-4">
                        <div class="w-10 h-10 grid place-items-center bg-red-50 text-red-700 rounded-full"><i class="fa-solid fa-triangle-exclamation"></i></div>
                        <div><p class="text-2xl font-semibold text-ink">${d.lowStock}</p><p class="text-muted text-xs">Low stock (≤5)</p></div>
                    </div>
                    <a href="products.html" class="bg-ink text-white p-5 flex items-center justify-between hover:bg-gold-dark transition">
                        <span class="text-sm font-semibold">Add a new product</span>
                        <i class="fa-solid fa-arrow-right"></i>
                    </a>
                </div>

                <div class="bg-white border border-line p-6">
                    <div class="flex items-center justify-between mb-4">
                        <h2 class="font-heading text-lg font-semibold text-ink">Recent Orders</h2>
                        <a href="orders.html" class="text-xs font-semibold text-gold-dark hover:underline">View all</a>
                    </div>
                    <table class="w-full text-left">
                        <thead>
                            <tr class="border-b border-line text-[10px] text-muted uppercase tracking-wide">
                                <th class="pb-2 font-semibold">Order #</th>
                                <th class="pb-2 font-semibold">Date</th>
                                <th class="pb-2 font-semibold">Total</th>
                                <th class="pb-2 font-semibold">Status</th>
                            </tr>
                        </thead>
                        <tbody>${rows || `<tr><td colspan="4" class="py-6 text-center text-muted text-sm">No orders yet.</td></tr>`}</tbody>
                    </table>
                </div>
            `;
        } catch (err) {
            main.innerHTML = `<p class="text-red-600 text-sm">${err.message}</p>`;
        }
    }

    load();
</script>
</body>
</html>
